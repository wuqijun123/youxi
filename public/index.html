<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f7fc"><title>同词相遇 · 一直想到一起</title>
  <link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body><main class="app">
  <header><a class="brand" href="/"><span class="logo">同</span>同词相遇</a><span class="badge">双人 · 异地联机</span></header>
  <section class="hero"><span class="eyebrow">SAME WORD</span><h1>从两个词出发，<br>直到想到一起。</h1><p>每轮各写一个词，同时揭晓。<br>没有题目，也没有轮数限制。</p></section>
  <section id="home" class="card">
    <label for="name">你的昵称</label><input id="name" maxlength="12" placeholder="让朋友认出你" autocomplete="nickname">
    <button id="create" class="primary">创建一个房间</button>
    <div class="divider">或加入朋友的房间</div>
    <label for="roomCode">6 位房间码</label><div class="join"><input id="roomCode" maxlength="6" placeholder="例如 A3F91C" autocomplete="off" spellcheck="false"><button id="join" class="secondary">加入</button></div>
    <p id="homeError" class="error" role="alert"></p>
    <p class="note">第一轮随意写一个词。之后每轮继续写词，<br>直到你们提交相同的词，游戏就成功了。</p>
  </section>
  <section id="room" class="card hidden">
    <div class="roomhead"><div><h2 id="roomTitle">等待朋友</h2><p id="connection" class="sub" aria-live="polite">正在连接…</p></div><span id="roundPill" class="badge"></span></div>
    <div class="invite"><div><small>房间码</small><strong id="codeLabel"></strong></div><button id="copy" class="small">复制邀请链接</button></div>
    <div id="players" class="players"></div>
    <div id="game"></div>
    <p id="roomError" class="error" role="alert"></p>
    <section id="historySection" class="hidden"><h3>你们的联想轨迹</h3><div id="history"></div></section>
    <button id="homeButton" class="text-button">返回首页</button>
  </section>
  <p class="footer">两人都提交后才揭晓 · 刷新页面可回到原房间</p>
</main><div id="toast" class="toast hidden" role="status"></div></body></html>
